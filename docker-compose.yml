services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncin
      POSTGRES_PASSWORD: syncin
      POSTGRES_DB: syncin
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncin -d syncin"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://syncin:syncin@postgres:5432/syncin?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: "3000"
      HOST: "0.0.0.0"
      PROVIDER: "mock"
      LOG_LEVEL: "info"
      # Retry policy (the experiment axis — see reminder.worker.ts).
      REMINDER_BACKOFF_STRATEGY: "${REMINDER_BACKOFF_STRATEGY:-equal_jitter}"
      REMINDER_MAX_ATTEMPTS: "${REMINDER_MAX_ATTEMPTS:-5}"
      REMINDER_BACKOFF_BASE_MS: "${REMINDER_BACKOFF_BASE_MS:-1000}"
      REMINDER_BACKOFF_CAP_MS: "${REMINDER_BACKOFF_CAP_MS:-15000}"
      # Milestone 6 failure-injection knobs (default off; set per experiment run).
      MOCK_FAILURE_RATE: "${MOCK_FAILURE_RATE:-0}"
      MOCK_PERMANENT_RATE: "${MOCK_PERMANENT_RATE:-0}"
      MOCK_LATENCY_MS: "${MOCK_LATENCY_MS:-0}"
      MOCK_RECOVER_AFTER_MS: "${MOCK_RECOVER_AFTER_MS:-0}"
    ports:
      - "${APP_PORT:-3000}:3000"
    # Apply committed migrations, seed the demo tenant (idempotent), then boot.
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run seed &&
             npm start"

volumes:
  pgdata:
  redis_data:
